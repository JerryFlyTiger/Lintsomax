[package]
name    = "lintsomax"
version = "0.0.1"
edition = "2021"

# For development: every variable stays visible (opt-level=1 was measured to turn
# variables into <optimized out>)
[profile.dev]
panic     = "abort"
opt-level = 0
debug     = 2

# For measurement: keep the symbols, no effect on run-time speed
[profile.release]
panic     = "abort"
opt-level = 2
debug     = 2
# The kernel's debug_asserts guard premises such as "the alignment the linker
# script guarantees". If they are compiled out, a violation happens silently,
# so they stay on in release too.
debug-assertions = true
